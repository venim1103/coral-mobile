                    this.symbolEmbeddings,
                    this.taskEmbeddings, 
                    this.ponderEmbeddings, 
                    this.outputHead, 
                    this.outputBias,
                    this.vocabHead,
                    this.vocabBias,
                    this.vocabAnchorsTensor
                ]);
                this.layers.flat().forEach(b => b.dispose());
            }
        }

        const serializeOptimizerState = async (opt, model) => {
            if (!opt || !model || model.isDisposed) return null;
            try {
                const vars = model.getOrderedVariables();
                const firstMMap = opt.accumulatedFirstMoment;
                const secondMMap = opt.accumulatedSecondMoment;
                const mList = [];
                const vList = [];

                const findMomentTensor = (mapObj, vName) => {
                    if (!mapObj) return null;
                    if (Array.isArray(mapObj)) {
                        const entry = mapObj.find(e => e && e.originalName === vName);
                        return entry ? entry.variable : null;
                    }
                    if (typeof mapObj === 'object' && mapObj[vName]) {
                        return mapObj[vName].variable || mapObj[vName];
                    }
                    return null;
                };

                for (let i = 0; i < vars.length; i++) {
                    const vName = vars[i].name;
                    const mVar = findMomentTensor(firstMMap, vName);
                    const vVar = findMomentTensor(secondMMap, vName);
                    mList.push(mVar && !mVar.isDisposed ? Array.from(await mVar.data()) : null);
                    vList.push(vVar && !vVar.isDisposed ? Array.from(await vVar.data()) : null);
                }

                const accBeta1 = (opt.accBeta1 && !opt.accBeta1.isDisposed) ? (await opt.accBeta1.data())[0] : null;
                const accBeta2 = (opt.accBeta2 && !opt.accBeta2.isDisposed) ? (await opt.accBeta2.data())[0] : null;

                return { accBeta1, accBeta2, mList, vList };
            } catch (e) {
                return null;
            }
        };

        const restoreOptimizerState = (opt, model, optData) => {
            if (!opt || !model || model.isDisposed || !optData) return false;
            try {
                const varsV153 = model.getOrderedVariables('v15.3');
                const varsV151 = model.getOrderedVariables('v15.1');
                const varsV150 = model.getOrderedVariables('v15.0');
                const varsV149 = model.getOrderedVariables('v14.9');
                const mListLen = optData.mList ? optData.mList.length : 0;

                let vars = varsV153;
                if (mListLen === varsV149.length) vars = varsV149;
                else if (mListLen === varsV150.length) vars = varsV150;
                else if (mListLen === varsV151.length) vars = varsV151;

                const firstMMap = opt.accumulatedFirstMoment;
                const secondMMap = opt.accumulatedSecondMoment;
                let restoredCount = 0;

                const findMomentTensor = (mapObj, vName) => {
                    if (!mapObj) return null;
                    if (Array.isArray(mapObj)) {
                        const entry = mapObj.find(e => e && e.originalName === vName);
                        return entry ? entry.variable : null;
                    }
                    if (typeof mapObj === 'object' && mapObj[vName]) {
                        return mapObj[vName].variable || mapObj[vName];
                    }
                    return null;
                };

                tf.tidy(() => {
                    if (optData.accBeta1 !== null && optData.accBeta1 !== undefined && opt.accBeta1 && !opt.accBeta1.isDisposed) {
                        opt.accBeta1.assign(tf.scalar(optData.accBeta1));
                    }
                    if (optData.accBeta2 !== null && optData.accBeta2 !== undefined && opt.accBeta2 && !opt.accBeta2.isDisposed) {
                        opt.accBeta2.assign(tf.scalar(optData.accBeta2));
                    }

                    for (let i = 0; i < vars.length; i++) {
                        const v = vars[i];
                        const expectedLen = v.shape.reduce((a, b) => a * b, 1);
                        let mArr = optData.mList && optData.mList[i];
                        let vArr = optData.vList && optData.vList[i];

                        if (v === model.taskEmbeddings && mArr && mArr.length === 20 * model.config.dModel && expectedLen === 21 * model.config.dModel) {
                            const padZeros = new Array(model.config.dModel).fill(0);
                            mArr = [...mArr, ...padZeros];
                            if (vArr && vArr.length === 20 * model.config.dModel) {
                                vArr = [...vArr, ...padZeros];
                            }
                        }

                        if (mArr && mArr.length === expectedLen) {
                            const mVar = findMomentTensor(firstMMap, v.name);
                            if (mVar && !mVar.isDisposed) {
                                mVar.assign(tf.tensor(mArr, v.shape));
                                restoredCount++;
                            }
                        }
                        if (vArr && vArr.length === expectedLen) {
                            const vVar = findMomentTensor(secondMMap, v.name);
                            if (vVar && !vVar.isDisposed) {
                                vVar.assign(tf.tensor(vArr, v.shape));
                            }
                        }
                    }
                });
                return restoredCount > 0;
            } catch (e) {
                return false;
            }
        };

        const getRobustMax = (data) => {
            if (data.length === 0) return 1;
            const sorted = [...data].filter(v => isFinite(v)).sort((a, b) => a - b);
            const index = Math.floor(sorted.length * 0.97);
            return Math.max(0.0001, sorted[index]);
        };

        const GeneralizationChart = ({ trainData, valData, threshold, step, onReset }) => {
            const sampledData = useMemo(() => {
                const len = trainData.length;
                if (len < 300) return { t: trainData, v: valData };
                const t = [], v = [];
                const stride = Math.ceil(len / 300);
                for(let i=0; i<len; i+=stride) { t.push(trainData[i]); v.push(valData[i]); }
                t.push(trainData[len-1]); v.push(valData[len-1]);
                return { t, v };
            }, [trainData, valData, step]); 
            
            if (!trainData.length) return <div className="h-44 flex items-center justify-center text-gray-600 text-xs bg-gray-900/50 rounded-2xl border border-gray-800">Waiting for training telemetry...</div>;
            
            const { t, v } = sampledData;
            const robustMax = Math.max(getRobustMax(t), getRobustMax(v));
            const totalPoints = t.length;
            const getY = (d) => { if (!isFinite(d)) return 100; const val = Math.min(d, robustMax); return 100 - (val / robustMax) * 100; };
            const pointsTrain = t.map((d, i) => `${(i / (totalPoints - 1 || 1)) * 100},${getY(d)}`).join(' ');
            const pointsVal = v.map((d, i) => `${(i / (totalPoints - 1 || 1)) * 100},${getY(d)}`).join(' ');
            
            return (
                <div className="relative h-44 w-full bg-[#08080c] rounded-2xl border border-gray-800/80 overflow-hidden chart-grid shadow-inner select-none group">
                    <div className="absolute top-0 left-0 w-full p-3 flex justify-between items-start z-10 pointer-events-none">
                        <div className="flex flex-col">
                            <div className="flex items-center gap-2"><h3 className="text-xs font-bold text-gray-300 flex items-center gap-1.5"><Eye size={13} className="text-emerald-400"/> GENERALIZATION GAP (MSE LOSS)</h3></div>
                            <div className="flex gap-4 mt-1"><span className="text-[10px] font-mono text-emerald-400">TRAIN: {Number(trainData[trainData.length-1]||0).toFixed(4)}</span><span className="text-[10px] font-mono text-amber-400">VAL: {Number(valData[valData.length-1]||0).toFixed(4)}</span></div>
                        </div>
                        <div className="pointer-events-auto flex items-center gap-2">
                             <span className="text-[10px] font-mono text-gray-400 bg-black/70 px-2 py-0.5 rounded border border-gray-800">STEP: {step}</span>
                             <button onClick={onReset} className="p-1.5 bg-black/70 hover:bg-red-900/50 text-gray-400 hover:text-red-400 rounded border border-gray-800 hover:border-red-900 transition-all" title="Reset Graph Scale"><Trash size={12} /></button>
                        </div>
                    </div>
                    <div className="absolute w-full border-t border-dashed border-emerald-500/30" style={{ bottom: `${Math.min(100, (threshold/robustMax)*100)}%` }}></div>
                    <svg className="w-full h-full" preserveAspectRatio="none" viewBox="0 0 100 100">
                        <polyline points={pointsTrain} fill="none" stroke="#10b981" strokeWidth="1.2" vectorEffect="non-scaling-stroke" strokeOpacity="0.85" />
                        <polyline points={pointsVal} fill="none" stroke="#f59e0b" strokeWidth="1.2" vectorEffect="non-scaling-stroke" strokeOpacity="0.85" />
                    </svg>
                </div>
            );
        };

        const CapacityEvolutionChart = ({ neuronData, consolidatedData, maxCapacity, step }) => {
            const sampledData = useMemo(() => {
                const len = neuronData.length;
                if (len < 300) return { n: neuronData, c: consolidatedData };
                const n = [], c = [];
                const stride = Math.ceil(len / 300);
                for (let i = 0; i < len; i += stride) {
                    n.push(neuronData[i]);
                    c.push(consolidatedData[i] || 0);
                }
                n.push(neuronData[len - 1]);
                c.push(consolidatedData[len - 1] || 0);
                return { n, c };
            }, [neuronData, consolidatedData, step]);

            if (!neuronData.length) {
                return (
                    <div className="h-44 flex items-center justify-center text-gray-600 text-xs bg-gray-900/50 rounded-2xl border border-gray-800">
                        Waiting for neurogenesis &amp; myelination telemetry...
                    </div>
                );
            }

            const { n, c } = sampledData;
            const peakN = Math.max(maxCapacity || 256, ...n, 16);
            const totalPoints = n.length;
            const getY = (val) => 100 - Math.min(96, Math.max(2, (val / peakN) * 92));
            const pointsActive = n.map((d, i) => `${(i / (totalPoints - 1 || 1)) * 100},${getY(d)}`).join(' ');
            const pointsLocked = c.map((d, i) => `${(i / (totalPoints - 1 || 1)) * 100},${getY(d)}`).join(' ');

            return (
                <div className="relative h-44 w-full bg-[#08080c] rounded-2xl border border-gray-800/80 overflow-hidden chart-grid shadow-inner select-none">
                    <div className="absolute top-0 left-0 w-full p-3 flex justify-between items-start z-10 pointer-events-none">
                        <div className="flex flex-col">
                            <div className="flex items-center gap-2">
                                <h3 className="text-xs font-bold text-gray-300 flex items-center gap-1.5">
                                    <Zap size={13} className="text-amber-400"/> TOPOLOGY &amp; MYELINATION EVOLUTION
                                </h3>
                            </div>
                            <div className="flex gap-4 mt-1">
                                <span className="text-[10px] font-mono text-amber-400">ACTIVE: {n[n.length - 1] || 0}N</span>
                                <span className="text-[10px] font-mono text-sky-400">MYELINATED: {c[c.length - 1] || 0}ð</span>
                            </div>
                        </div>
                        <span className="text-[10px] font-mono text-gray-400 bg-black/70 px-2 py-0.5 rounded border border-gray-800">
                            MAX: {maxCapacity}N
                        </span>
                    </div>
                    <svg className="w-full h-full" preserveAspectRatio="none" viewBox="0 0 100 100">
                        <polyline points={pointsActive} fill="none" stroke="#f59e0b" strokeWidth="1.4" vectorEffect="non-scaling-stroke" strokeOpacity="0.9" />
                        <polyline points={pointsLocked} fill="none" stroke="#38bdf8" strokeWidth="1.4" vectorEffect="non-scaling-stroke" strokeOpacity="0.85" />
                    </svg>
                </div>
            );
        };

        const SignalFlowViz = ({ residuals }) => {
            const canvasRef = useRef(null);
            const offscreenCanvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || !residuals.length) return;
                const ctx = canvas.getContext('2d', { alpha: false });
                if (!ctx) return;

                const width = canvas.width; 
                const height = canvas.height; 
                const layerCount = residuals.length; 
                const layerHeight = height / layerCount;

                if (!offscreenCanvasRef.current) {
                    offscreenCanvasRef.current = document.createElement('canvas');
                }
                const offCanvas = offscreenCanvasRef.current;
                const atlasCols = 512;
                if (offCanvas.width !== atlasCols || offCanvas.height !== layerCount) {
                    offCanvas.width = atlasCols;
                    offCanvas.height = layerCount;
                }
                const offCtx = offCanvas.getContext('2d', { alpha: false });
                const imgData = offCtx.createImageData(atlasCols, layerCount);
                const buf32 = new Uint32Array(imgData.data.buffer);
                buf32.fill(0xFF090606);

                residuals.forEach((layer, lIdx) => {
                    const data = layer.data;
                    const len = data.length || 1;
                    const rowOffset = lIdx * atlasCols;
                    for (let c = 0; c < atlasCols; c++) {
                        const srcIdx = Math.min(len - 1, Math.floor((c * len) / atlasCols));
                        const val = data[srcIdx] || 0;
                        const intensity = Math.floor(Math.tanh(val) * 255);
                        let r = 0, g = 0, b = 0;
                        if (intensity > 0) {
                            r = intensity;
                            g = intensity >> 1;
                            b = 0;
                        } else {
                            const absI = Math.abs(intensity);
                            r = 0;
                            g = absI >> 1;
                            b = absI;
                        }
                        buf32[rowOffset + c] = (255 << 24) | (b << 16) | (g << 8) | r;
                    }
                });

                offCtx.putImageData(imgData, 0, 0);
                ctx.fillStyle = '#060609'; 
                ctx.fillRect(0, 0, width, height);
                ctx.imageSmoothingEnabled = false;

                const isCompact = layerCount > 5;
                const barYOffset = isCompact ? 1 : 13;
                const barHeight = isCompact ? Math.max(4, Math.floor(layerHeight - 2)) : Math.max(2, Math.floor(layerHeight - 15));

                residuals.forEach((layer, lIdx) => {
                    const y = lIdx * layerHeight; 
                    ctx.drawImage(offCanvas, 0, lIdx, atlasCols, 1, 0, y + barYOffset, width, barHeight);

                    if (isCompact) {
                        ctx.fillStyle = 'rgba(6, 6, 9, 0.82)';
                        ctx.fillRect(2, y + 1, 56, Math.max(8, layerHeight - 2));
                        ctx.fillStyle = '#e5e7eb'; 
                        ctx.font = '8px monospace'; 
                        ctx.fillText(layer.name.toUpperCase(), 4, y + layerHeight - 3);
                    } else {
                        ctx.fillStyle = '#9ca3af'; 
                        ctx.font = '9px monospace'; 
                        ctx.fillText(layer.name.toUpperCase(), 4, y + 10);
                    }

                    if (lIdx < layerCount - 1) { 
                        ctx.fillStyle = '#1c1c24'; 
                        ctx.fillRect(0, y + layerHeight - 1, width, 1); 
                    }
                });
            }, [residuals]);
            return <canvas ref={canvasRef} width={512} height={140} className="w-full h-full canvas-container"/>;
        };

        const MultiBlockViz = ({ blocks, rows, cols }) => {
            const canvasRef = useRef(null);
            const offscreenCanvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || !blocks.length) return;
                const ctx = canvas.getContext('2d', { alpha: false });
                if (!ctx) return;

                const width = canvas.width;
                const height = canvas.height;
                const numBlocks = blocks.length;
                const blockHeight = height / numBlocks;
                ctx.fillStyle = '#060609';
                ctx.fillRect(0, 0, width, height);

                if (!offscreenCanvasRef.current) {
                    offscreenCanvasRef.current = document.createElement('canvas');
                }
                const offCanvas = offscreenCanvasRef.current;
                const totalRows = rows * numBlocks;
                if (offCanvas.width !== cols || offCanvas.height !== totalRows) {
                    offCanvas.width = cols;
                    offCanvas.height = totalRows;
                }
                const offCtx = offCanvas.getContext('2d', { alpha: false });

                const imgData = offCtx.createImageData(cols, totalRows);
                const buf32 = new Uint32Array(imgData.data.buffer);
                const bgPixel = 0xFF090606; 
                buf32.fill(bgPixel);

                blocks.forEach((blockData, idx) => {
                    const w = blockData.w;
                    const m = blockData.m;
                    const consolidatedMask = blockData.c;
                    const blockRowStart = idx * rows;

                    for (let r = 0; r < rows; r++) {
                        const srcRowOffset = r * cols;
                        const dstRowOffset = (blockRowStart + r) * cols;
                        for (let colIdx = 0; colIdx < cols; colIdx++) {
                            if (colIdx >= m.length) break;
                            if (m[colIdx] !== 1) continue;

                            const val = w[srcRowOffset + colIdx];
                            if (val === undefined) continue;

                            const isMyelinated = consolidatedMask && consolidatedMask[colIdx] === 1;
                            const intensity = Math.min(255, Math.abs(val) * 800);
                            let pixelColor;
                            if (isMyelinated && r < 2) {
                                pixelColor = (255 << 24) | (50 << 16) | (210 << 8) | 255;
                            } else if (val > 0) {
                                const green = Math.max(0, 50 - (intensity >> 2));
                                pixelColor = (255 << 24) | (0 << 16) | (green << 8) | 255;
                            } else {
                                const green = Math.max(0, 70 - (intensity >> 2));
                                pixelColor = (255 << 24) | (255 << 16) | (green << 8) | 0;
                            }
                            buf32[dstRowOffset + colIdx] = pixelColor;
                        }
                    }
                });

                offCtx.putImageData(imgData, 0, 0);
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(offCanvas, 0, 0, width, height);

                blocks.forEach((blockData, idx) => {
                    const yOffset = idx * blockHeight;
                    const { label, activeFF, activeHeads, consolidated } = blockData;
                    ctx.fillStyle = 'rgba(0,0,0,0.78)';
                    ctx.fillRect(2, yOffset + 2, 155, 14);
                    ctx.fillStyle = '#e5e7eb'; 
                    ctx.font = '9px monospace'; 
                    ctx.fillText(`${label} (${activeFF}N | ${activeHeads}H | ${consolidated||0}ð)`, 5, yOffset + 12); 
                    if (idx > 0) { 
                        ctx.fillStyle = '#262633'; 
                        ctx.fillRect(0, yOffset, width, 1); 
                    }
                });
            }, [blocks, rows, cols]);

            return <canvas ref={canvasRef} width={512} height={140} className="w-full h-full canvas-container"/>;
        };

        const AttentionViz = ({ attentionData, activeBlockIndex, setBlockIndex, selectedPixel }) => {
            const canvasRef = useRef(null);
            const offscreenCanvasRef = useRef(null);

            const safeIndex = Math.min(activeBlockIndex, Math.max(0, attentionData.length - 1)); 
            const dataObj = attentionData[safeIndex]; 
            const data = dataObj ? dataObj.data : null; 
            const taskRouting = dataObj ? dataObj.taskRouting : null;
            const mask = dataObj ? dataObj.mask : null; 
            const heads = dataObj ? (dataObj.maxHeads || 4) : 4;
            const seqLen = dataObj ? dataObj.seqLen : 16;

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || !data) return;
                const ctx = canvas.getContext('2d', { alpha: false });
                if (!ctx) return;

                const width = canvas.width;
                const height = canvas.height;
                ctx.fillStyle = '#060609';
                ctx.fillRect(0, 0, width, height);

                const slotWidth = width / heads;
                const headRenderSize = Math.min(height - 18, slotWidth - 6);

                if (!offscreenCanvasRef.current) {
                    offscreenCanvasRef.current = document.createElement('canvas');
                }
                const offCanvas = offscreenCanvasRef.current;
                const atlasWidth = heads * seqLen;
                if (offCanvas.width !== atlasWidth || offCanvas.height !== seqLen) {
                    offCanvas.width = atlasWidth;
                    offCanvas.height = seqLen;
                }
                const offCtx = offCanvas.getContext('2d', { alpha: false });

                const imgData = offCtx.createImageData(atlasWidth, seqLen);
                const buf32 = new Uint32Array(imgData.data.buffer);
                buf32.fill(0xFF090606);

                let activeIdx = 0;
                for (let h = 0; h < heads; h++) {
                    const isActive = mask ? mask[h] === 1 : (h === 0);
                    if (!isActive) continue;

                    const headDataOffset = activeIdx * seqLen * seqLen;
                    const atlasColOffset = h * seqLen;
                    activeIdx++;

                    for (let r = 0; r < seqLen; r++) {
                        const srcRowOffset = r * seqLen;
                        const dstRowOffset = r * atlasWidth + atlasColOffset;
                        for (let c = 0; c < seqLen; c++) {
                            const val = data[headDataOffset + srcRowOffset + c] || 0;
                            const intensity = Math.min(255, Math.floor(val * 255 * (seqLen / 8)));
                            const red = Math.min(255, Math.floor(intensity * 1.8));
                            const green = Math.floor(intensity * 0.9);
                            const blue = Math.max(20, 60 - intensity);
                            buf32[dstRowOffset + c] = (255 << 24) | (blue << 16) | (green << 8) | red;
                        }
                    }
                }

                offCtx.putImageData(imgData, 0, 0);
                ctx.imageSmoothingEnabled = false;

                let activeIdxRender = 0;
                for (let h = 0; h < heads; h++) {
                    const isActive = mask ? mask[h] === 1 : (h === 0);
                    const xOffset = h * slotWidth + (slotWidth - headRenderSize) / 2;
                    const yOffset = 4;

                    if (!isActive) { 
                        ctx.strokeStyle = '#1a1a24'; 
                        ctx.strokeRect(xOffset, yOffset, headRenderSize, headRenderSize);
                        ctx.fillStyle = '#374151'; 
                        ctx.font = '9px monospace'; 
                        ctx.fillText(`H${h+1} (OFF)`, xOffset + 4, yOffset + headRenderSize + 11);
                        continue; 
                    }

                    ctx.drawImage(
                        offCanvas,
                        h * seqLen, 0, seqLen, seqLen,
                        xOffset, yOffset, headRenderSize, headRenderSize
                    );

                    if (selectedPixel !== null && selectedPixel < seqLen) {
                        const cellSize = headRenderSize / seqLen;
                        ctx.strokeStyle = 'rgba(56, 189, 248, 0.9)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(xOffset, yOffset + (selectedPixel * cellSize), headRenderSize, Math.max(1, cellSize));
                    }

                    let taskAttnAvg = 0;
                    if (taskRouting) {
                        for (let s = 0; s < seqLen; s++) {
                            taskAttnAvg += (taskRouting[activeIdxRender * seqLen + s] || 0);
                        }
                        taskAttnAvg = Math.round((taskAttnAvg / seqLen) * 100);
                    }
                    activeIdxRender++;

                    ctx.fillStyle = '#38bdf8'; 
                    ctx.font = '9px monospace'; 
                    ctx.fillText(`H${h+1} (Task:${taskAttnAvg}%)`, xOffset + 2, yOffset + headRenderSize + 11);
                }
            }, [data, taskRouting, mask, heads, seqLen, selectedPixel]);

            return (
                <div className="w-full h-full relative group">
                     <canvas ref={canvasRef} width={512} height={140} className="w-full h-full canvas-container"/>
                     <div className="absolute top-2 right-2 flex flex-wrap gap-1 bg-black/80 p-1.5 rounded-lg border border-gray-800 backdrop-blur-sm max-w-[260px] justify-end">
                        {attentionData.map((d, idx) => ( 
                            <button key={idx} onClick={() => setBlockIndex(idx)} className={`text-[9px] px-2 py-0.5 rounded font-mono border transition-all ${idx === safeIndex ? 'bg-sky-500/20 text-sky-300 border-sky-500/50' : 'bg-gray-900 text-gray-400 border-gray-800 hover:bg-gray-800'}`}>
                                {d.label}
                            </button> 
                        ))}
                     </div>
                </div>
            );
        };

        const inspectDnaObject = (parsed, rawLength = 0) => {
            try {
                if (!parsed || !parsed.model) return null;
                const m = parsed.model || {};
                const topo = m.topology || [];
                const numLayers = topo.length;
                const activeN = m.activeNeurons || 0;
                let paramCount = m.totalParameters || 0;
                if (!paramCount) {
                    topo.forEach(layer => {

                            Object.values(w).forEach(arr => {

                        });

                const hasOpt = !!(parsed.optimizer && parsed.optimizer.mList && parsed.optimizer.mList.length > 0);
                const binaryVramMb = ((paramCount * 3 * 4) / (1024 * 1024)).toFixed(2);
                const jsonKb = (rawLength / 1024).toFixed(1);
                const numGlobals = m.globals ? Object.keys(m.globals).length : 9;
                const expectedTensors = numGlobals + 1 + (numLayers * 13) + 4 + ((numGlobals + numLayers * 10) * 2 + 2);
                return {
                    tier: parsed.tier || 1,
                    step: parsed.step || 0,
                    numLayers,
                    activeN,
                    paramCount,
                    hasOpt,
                    binaryVramMb,
                    jsonKb,

        const DnaVaultModal = ({ isOpen, onClose, onExport, onImport, onQuickSave, onQuickLoad, hasSavedSlot, toast }) => {

        };

        const InfoModal = ({ onClose }) => (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md p-4">

                        <h2 className="text-base font-bold text-white flex items-center gap-2"><Brain size={20} className="text-amber-500"/> C.O.R.A.L. v15.2 SYMBOLIC &amp; RECURRENT CORTEX</h2>

                            </h3>
                            <p>Rather than tying computational depth strictly to parameter count, C.O.R.A.L. v15.2 cycles the latent token stream through its existing organic layers for <i>K</i> recurrent "Thinking Steps" before projecting to the output head. A 3-layer cortex pondering for <i>K=4</i> steps achieves an effective depth of <b>12 layers with 0 additional weight matrices</b>!</p>

            const handleApplyImportedJson = async (rawContent) => {

                    isHydratingRef.current = true;

                    optimizerRef.current = tf.train.adam(gameState.current.learningRate);

                    gameState.current.consolidatedHistory = data.consolidatedHistory || new Array(loadedTrainHist.length).fill(consN);
                    gameState.current.activeNeurons = activeN;
                    gameState.current.consolidatedNeurons = consN;
                    gameState.current.maxPossibleNeurons = tempModel.getMaxPossibleNeurons();
                    gameState.current.vizBlockIndex = 0;
                    stepRef.current = loadedStep; 
                    lastStepCount.current = loadedStep;
                    if (loadedValHist.length > 0) {
                        lastValLossRef.current = loadedValHist[loadedValHist.length - 1];
                    }

                    if (!data.probeInput) {

                    setUiState(prev => ({

                    }));
                    
                    setupTier(loadedTier, true, {
                        ...hydratedCfg,
                        configSize: hydratedCfg.size,
                        batchSize: gameState.current.batchSize,
                        learningRate: gameState.current.learningRate,
                        ponderSteps: hydratedCfg.ponderSteps || 1,
                        readoutMode: hydratedCfg.readoutMode || 'scalar',
                        activeVocab: hydratedCfg.activeVocab || 4,
                        manifoldMode: hydratedCfg.manifoldMode || '2d'
                    }, newProbe); 

                    await syncUI(newProbe, 0); 
                    refreshMemoryTelemetry(0);
                    const paramsK = (tempModel.getTotalParameters() / 1000).toFixed(1);
                    showToast(`Restored ${tempModel.layers.length}L âĒ ${paramsK}K Params (${gameState.current.activeNeurons}N | ${hydratedCfg.ponderSteps || 1}x Ponder${restoredOpt ? ' + Adam' : ''})`);
                } catch(err) { 
                    showToast(`Load Failed: ${err.message}`);
                } finally {
                    setTimeout(() => {
                        isHydratingRef.current = false;
                    }, 250);
                }
            };

            const handleQuickLoad = async () => {
                const stored = localStorage.getItem('coral_brain_dna_slot');
                if (!stored) {
                    showToast("No Quick-Save found");
                    return;
                }
                await handleApplyImportedJson(stored);
            };

            const checkEvolution = (vLoss) => {
                const gs = gameState.current; 
                const activeModel = modelRef.current;
                if (!gs.autoEvolve || isGrowingRef.current || !activeModel || activeModel.isDisposed) return false;
                const currentTierIndex = TIERS.findIndex(t => t.id === gs.tier);
                const maxAutoTierIndex = Math.min(19, TIERS.length - 1); // Cap auto-evolution at Tier 20
                if (vLoss < gs.evoThreshold) { 
                    activeModel.consolidateMasteredTask().then(() => {
                        if (modelRef.current === activeModel && !activeModel.isDisposed) {
                            gs.consolidatedNeurons = activeModel.getTotalConsolidatedNeurons();
                        }
                    });
                    setRetentionMap(prev => ({ ...prev, [gs.tier]: 100 }));

                    if (currentTierIndex >= 0 && currentTierIndex < maxAutoTierIndex) { 
                        const nextTier = TIERS[currentTierIndex + 1];
                        showToast(`Tier ${gs.tier} Mastered & Myelinated! -> ${nextTier.name}`);
                        setupTier(nextTier.id, true); 
                        return true; 
                    } 
                    return false; 
                }
                if (vLoss > gs.evoThreshold * 3 && gs.valHistory.length % 20 === 0) { 
                    if (activeModel.config.readoutMode === 'vocab' && (activeModel.config.activeVocab || 4) < MAX_VOCAB) {
                        isGrowingRef.current = true;
                        activeModel.growVocab(2).then(grewV => {
                            isGrowingRef.current = false;
                            if (grewV && modelRef.current === activeModel && !activeModel.isDisposed) {
                                const newV = activeModel.config.activeVocab;
                                gs.activeVocab = newV;
                                pendingVizSyncRef.current = true;
                                setUiState(p => ({ ...p, activeVocab: newV }));
                                showToast(`Auto-Evolution: Expanded Symbolic Vocab to ${newV}/10 Classes!`);
                            }
                        });
                        return false;
                    }

                    const currPonder = activeModel.config.ponderSteps || 1;
                    const tierObj = TIERS.find(t => t.id === gs.tier);
                    if (tierObj && tierObj.type === 'Logic' && currPonder < 2 && Math.random() < 0.5) {
                        activeModel.config.ponderSteps = currPonder + 1;
                        gs.ponderSteps = currPonder + 1;
                        setUiState(p => ({ ...p, ponderSteps: currPonder + 1 }));
                        showToast(`Adaptive Evolution: Activated ${currPonder + 1}x Pondering Loop`);
                        return false;
                    }

                    const prevLayers = activeModel.layers.length;
                    isGrowingRef.current = true;
                    activeModel.grow(gs.chunkSize, gs.headRatio).then(grew => {
                        isGrowingRef.current = false;
                        if (grew && modelRef.current === activeModel && !activeModel.isDisposed) {
                            if (activeModel.layers.length > prevLayers && optimizerRef.current) {
                                warmupOptimizer(activeModel, optimizerRef.current, gs.tier, gs.regStrength);
                            }
                            gs.activeNeurons = activeModel.getTotalActiveNeurons(); 
                            gs.maxPossibleNeurons = activeModel.getMaxPossibleNeurons();
                            gs.status = "GROWING"; 
                        }
                    });
                } 
                else if (gs.valHistory.length > 100 && gs.valHistory.length % 150 === 0 && vLoss < gs.evoThreshold * 2) { 
                    isGrowingRef.current = true;
                    activeModel.prune(gs.pruneRate).then(pruned => {
                        isGrowingRef.current = false;
                        if (pruned > 0 && modelRef.current === activeModel && !activeModel.isDisposed) {
                            gs.activeNeurons = activeModel.getTotalActiveNeurons(); 
                            gs.status = "SLEEPING"; 
                        }
                    });
                }
                return false;
            };

            const trainStep = useCallback(async (myLoopId) => {
                if (myLoopId !== undefined && myLoopId !== loopIdRef.current) return;
                const currentLoopId = myLoopId !== undefined ? myLoopId : loopIdRef.current;

                const gs = gameState.current;
                const activeModel = modelRef.current;
                if (!activeModel || activeModel.isDisposed || !gs.isPlaying || gs.isTransitioning || isGrowingRef.current || isEvaluatingRetentionRef.current) { 
                    if (gs.isPlaying && currentLoopId === loopIdRef.current) {
                        animFrameRef.current = requestAnimationFrame(() => trainStep(currentLoopId)); 
                    }
                    return; 
                }

                if (isTrainingStepRef.current) return;
                isTrainingStepRef.current = true;

                try {
                    const activeGridSize = activeModel.config.gridSize;
                    if (stepRef.current % 15 === 0 || !gs.trainSet || !gs.trainSet.xs || gs.trainSet.xs.isDisposed) {
                        if (gs.trainSet && gs.trainSet.xs && !gs.trainSet.xs.isDisposed) { gs.trainSet.xs.dispose(); gs.trainSet.ys.dispose(); }
                        gs.trainSet = createDataset(gs.batchSize, gs.tier, activeGridSize, customSandboxRef.current);
                    }

                    let { xs: tX, ys: tY } = gs.trainSet; 
                    let activeTrainTier = gs.tier;
                    const { xs: vX, ys: vY } = gs.valSet || {};
                    let doingReplay = false; 
                    
                    if (gs.memoryReplay && gs.tier > 1 && Math.random() < gs.replayRate) {
                        const prevTierIndex = Math.floor(Math.random() * (TIERS.findIndex(t => t.id === gs.tier)));
                        const prevTierId = TIERS[prevTierIndex].id;
                        if (replayBatchRef.current) { 
                            if (replayBatchRef.current.xs && !replayBatchRef.current.xs.isDisposed) replayBatchRef.current.xs.dispose(); 
                            if (replayBatchRef.current.ys && !replayBatchRef.current.ys.isDisposed) replayBatchRef.current.ys.dispose(); 
                        }
                        replayBatchRef.current = createDataset(32, prevTierId, activeGridSize, customSandboxRef.current); 
                        if (replayBatchRef.current.xs) { 
                            tX = replayBatchRef.current.xs; 
                            tY = replayBatchRef.current.ys; 
                            activeTrainTier = prevTierId;
                            doingReplay = true; 
                        }
                    }
                    
                    if (!tX || tX.isDisposed || !tY || tY.isDisposed) {
                        if (gs.isPlaying && currentLoopId === loopIdRef.current) {
                            animFrameRef.current = requestAnimationFrame(() => trainStep(currentLoopId));
                        }
                        return;
                    }

                    if (doingReplay !== isReplayingRef.current) {
                        isReplayingRef.current = doingReplay;
                        setIsReplaying(doingReplay); 
                    }
                    const K = Math.max(1, activeModel.config.ponderSteps || 1);
                    const ponderLrScale = 1.0 / Math.pow(K, 0.35);
                    const effectiveLR = (doingReplay ? gs.learningRate * 0.75 : gs.learningRate) * ponderLrScale; 
                    optimizerRef.current.learningRate = effectiveLR;

                    frameCountRef.current++;
                    const shouldValidate = (frameCountRef.current % (K > 1 ? 8 : 5) === 0) || (lastValLossRef.current === null);
                    const safeCap = K >= 3 ? 1 : (K === 2 ? 2 : 6);
                    const maxStepsThisFrame = gs.highPerf 
                        ? Math.max(1, Math.min(6, Math.ceil(gs.simSpeed / K))) 
                        : Math.min(safeCap, Math.max(1, Math.ceil(gs.simSpeed / K)));
                    
                    const lossTensor = tf.tidy(() => {
                        let lastCost = null;
                        const frameStart = performance.now();
                        for (let i = 0; i < maxStepsThisFrame; i++) {
                            if (!gs.highPerf && i > 0 && (performance.now() - frameStart) > 8) break;
                            const hPrefix = K > 1 ? activeModel.computePonderPrefix(tX, activeTrainTier, null, K) : null;
                            const cost = optimizerRef.current.minimize(() => { 
                                return activeModel.computeTrainLoss(tX, tY, hPrefix, activeTrainTier, null, K, gs.regStrength);
                            }, true); 
                            if (hPrefix) hPrefix.dispose();
                            if (lastCost) lastCost.dispose(); 
                            lastCost = cost; 
                            stepRef.current++;
                        }
                        return lastCost;
                    });
                    
                    if (!lossTensor) { 
                        if (gs.isPlaying && currentLoopId === loopIdRef.current) {
                            animFrameRef.current = requestAnimationFrame(() => trainStep(currentLoopId)); 
                        }
                        return; 
                    }

                    const currentLossData = await lossTensor.data();
                    const currentLoss = currentLossData[0];
                    lossTensor.dispose();

                    let vLossVal = lastValLossRef.current;
                    if (shouldValidate && vX && !vX.isDisposed && vY && !vY.isDisposed) {
                        const vLossTensor = tf.tidy(() => {
                            const evalCount = K > 1 ? Math.min(32, vX.shape[0]) : vX.shape[0];
                            const subVX = evalCount < vX.shape[0] ? vX.slice([0, 0], [evalCount, -1]) : vX;
                            const subVY = evalCount < vY.shape[0] ? vY.slice([0, 0], [evalCount, -1]) : vY;
                            const vPred = activeModel.predictInference(subVX, gs.tier, null, K);
                            return tf.losses.meanSquaredError(subVY, vPred);
                        });
                        const vData = await vLossTensor.data();
                        vLossVal = vData[0];
                        lastValLossRef.current = vLossVal;
                        vLossTensor.dispose();
                    }
                    
                    if (!isNaN(currentLoss) && isFinite(currentLoss)) {
                        if (!doingReplay) { 
                            if (gs.trainHistory.length > 2000) gs.trainHistory.shift(); 
                            if (gs.valHistory.length > 2000) gs.valHistory.shift(); 
                            if (gs.neuronHistory.length > 2000) gs.neuronHistory.shift();
                            if (gs.consolidatedHistory.length > 2000) gs.consolidatedHistory.shift();
                            gs.trainHistory.push(currentLoss); 
                            gs.valHistory.push(vLossVal); 
                            gs.neuronHistory.push(gs.activeNeurons);
                            gs.consolidatedHistory.push(gs.consolidatedNeurons);
                            gs.status = "TRAINING";
                            checkEvolution(vLossVal); 
                        }

                        if (stepRef.current % 35 === 0 && gs.tier > 1) {
                            await evaluateRetentionRoundRobin();
                        }

                        const now = Date.now();
                        if (now - lastDrawTime.current > (1000 / FPS_LIMIT)) { 
                            const nowPerf = performance.now();
                            const elapsedSec = (nowPerf - lastTelemetryTime.current) / 1000;
                            if (elapsedSec >= 0.8) {
                                const sps = Math.round((stepRef.current - lastStepCount.current) / elapsedSec);
                                refreshMemoryTelemetry(sps);
                                lastTelemetryTime.current = nowPerf;
                                lastStepCount.current = stepRef.current;
                            }

                            if (gs.mainTab === 'telemetry' && !pendingVizSyncRef.current) {
                                gs.activeNeurons = activeModel.getTotalActiveNeurons();
                                gs.consolidatedNeurons = activeModel.getTotalConsolidatedNeurons();
                                gs.maxPossibleNeurons = activeModel.getMaxPossibleNeurons();
                            }

                            setUiState(prev => ({ 
                                ...prev, 
                                step: stepRef.current, 
                                status: doingReplay ? `REPLAY T${activeTrainTier}` : gs.status, 
                                activeNeurons: gs.activeNeurons,
                                consolidatedNeurons: gs.consolidatedNeurons,
                                maxPossibleNeurons: gs.maxPossibleNeurons,
                                ponderSteps: activeModel.config.ponderSteps || 1,
                                readoutMode: activeModel.config.readoutMode || 'scalar',
                                activeVocab: activeModel.config.activeVocab || 4,
                                manifoldMode: activeModel.config.manifoldMode || '2d'
                            })); 
                            lastDrawTime.current = now; 
                            if (pendingVizSyncRef.current || (gs.mainTab !== 'telemetry' && Math.random() < (K >= 3 ? 0.25 : 0.35))) {

                                        <div className="grid grid-cols-2 gap-1.5 pt-1">
                                            <button
                                                onClick={() => handleSetManifoldMode('2d')}
                                                className={`py-1.5 rounded-xl border text-[10px] font-mono font-bold transition-all ${uiState.manifoldMode === '2d' ? 'bg-amber-500/25 border-amber-500/50 text-amber-300' : 'bg-black/40 border-gray-800 text-gray-400'}`}
                                            >
                                                2D Spatial RoPE
                                            </button>
                                            <button
                                                onClick={() => handleSetManifoldMode('1d')}
                                                className={`py-1.5 rounded-xl border text-[10px] font-mono font-bold transition-all ${uiState.manifoldMode === '1d' ? 'bg-cyan-500/25 border-cyan-500/50 text-cyan-300' : 'bg-black/40 border-gray-800 text-gray-400'}`}
                                            >
                                                1D Sequence RoPE
                                            </button>
                                        </div>
                                    </div>

                                    {/* ALGORITHMIC RULE PRESETS */}
                                    <div className="p-3 bg-gray-900/60 rounded-xl border border-gray-800 space-y-2">
                                        <div className="text-[10px] font-mono font-bold text-amber-300 uppercase tracking-wider">
                                            One-Click Tier 21 Rule Presets
                                        </div>
                                        {[
                                            { id: 'pairs', label: 'Interactive Few-Shot Pairs', desc: 'Trains on your painted Input -> Target examples above.' },
                                            { id: 'preset_rot90', label: '90Â° Clockwise Matrix Rotation', desc: 'Global 2D spatial transpose + column reversal.' },
                                            { id: 'preset_rule110', label: '1D Rule 110 Cellular Automaton', desc: 'Turing-complete 1D elementary automaton (try 1D RoPE!).' },
                                            { id: 'preset_swap', label: 'Symbolic Color Swap (1â2, 3â4, 8â9)', desc: 'Bijective non-linear symbol permutation.' }
                                        ].map(preset => {
                                            const active = customSandbox.mode === preset.id;
                                            return (
                                                <button
                                                    key={preset.id}
                                                    onClick={() => {
                                                        updateCustomSandbox(prev => {
                                                            const next = { ...prev, mode: preset.id };
                                                            refreshSandboxDatasetsIfActive(next);
                                                            return next;
                                                        });
                                                        if (preset.id === 'preset_rule110') handleSetManifoldMode('1d');
                                                        showToast(`Tier 21 Mode: ${preset.label}`);
                                                    }}
                                                    className={`w-full p-2 rounded-xl border text-left transition-all ${active ? 'bg-amber-950/40 border-amber-500/60 text-amber-100' : 'bg-black/40 border-gray-800/80 text-gray-400 hover:text-gray-200'}`}
                                                >
                                                    <div className="text-[11px] font-bold flex justify-between items-center">
                                                        <span>{preset.label}</span>
                                                        {active && <span className="text-[9px] font-mono text-amber-400">ACTIVE</span>}
                                                    </div>
                                                    <div className="text-[9px] opacity-70 mt-0.5">{preset.desc}</div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
