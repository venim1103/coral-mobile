<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C.O.R.A.L. v15.3 (Self-Evolving Multimodal Cortex)</title>
    
    <!-- React & DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- TensorFlow.js & WebGPU Backend -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.17.0/dist/tf-backend-webgpu.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/coral.css">
</head>
<body>
    <div id="root">
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:monospace;color:#38bdf8;font-size:12px;">
            Initializing C.O.R.A.L. v15.3 Neural Cortex...
        </div>
    </div>
    <script>
        window.addEventListener('error', function(e) {
            var root = document.getElementById('root');
            if (root && root.innerText.indexOf('Initializing C.O.R.A.L.') !== -1) {
                root.innerHTML = '<div style="padding:20px;font-family:monospace;color:#f87171;background:#111;border:1px solid #7f1d1d;margin:16px;border-radius:12px;font-size:12px;">' +
                    '<b>Boot Error:</b> ' + (e.message || 'Unknown error') + '<br/>' +
                    '<span style="color:#9ca3af;font-size:10px;">' + (e.filename || '') + ':' + (e.lineno || '') + '</span></div>';
            }
        });
    </script>

    <!-- Core Non-JSX Modules (Native JavaScript, Instant Loading) -->
    <script src="src/core/curriculum.js"></script>
    <script src="src/core/dataset.js"></script>
    <script src="src/engine/rope.js"></script>
    <script src="src/engine/OrganicBlock.js"></script>
    <script src="src/engine/CoralModel.js"></script>
    <script src="src/engine/dnaVault.js"></script>

    <!-- UI Components & Workspaces (JSX Transpiled by Babel) -->
    <script type="text/babel" src="src/components/Icons.jsx"></script>
    <script type="text/babel" src="src/components/TelemetryCharts.jsx"></script>
    <script type="text/babel" src="src/components/CortexVisualizers.jsx"></script>
    <script type="text/babel" src="src/components/Modals.jsx"></script>
    <script type="text/babel" src="src/workspaces/StudioWorkspace.jsx"></script>
    <script type="text/babel" src="src/workspaces/TelemetryWorkspace.jsx"></script>
    <script type="text/babel" src="src/workspaces/SandboxWorkspace.jsx"></script>
    <script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
